        createdAt:
          type: string
          format: date-time
      required: [id, name, agingThresholdDays, createdAt]

    OrganizationSettings:
      type: object
      properties:
        agingThresholdDays:
          type: integer
          minimum: 1
          maximum: 365
      required: [agingThresholdDays]

