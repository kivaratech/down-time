      type: object
      properties:
        agingThresholdDays:
          type: integer
          minimum: 1
          maximum: 365
      required: [agingThresholdDays]

    OrganizationSummary:
      allOf:
        - $ref: "#/components/schemas/Organization"
        - type: object
          properties:
            restaurantCount:
              type: integer
            adminCount:
              type: integer
            supervisorCount:
              type: integer
          required: [restaurantCount, adminCount, supervisorCount]

    OrgUser:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [supervisor, admin]
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, email, name, role, isActive, createdAt]

    OrganizationDetail:
      allOf:
        - $ref: "#/components/schemas/Organization"
        - type: object
          properties:
            restaurants:
              type: array
              items:
                $ref: "#/components/schemas/Restaurant"
            admins:
              type: array
              items:
                $ref: "#/components/schemas/OrgUser"
            supervisors:
              type: array
              items:
                $ref: "#/components/schemas/OrgUser"
          required: [restaurants, admins, supervisors]

