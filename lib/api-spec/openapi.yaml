        label:
          type: string
        description:
          type: string
        itemCount:
          type: integer
      required: [key, label, description, itemCount]

    CreateOrganizationRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        adminEmail:
          type: string
          format: email
          description: Email of the first admin (globally unique; used for login).
        adminName:
          type: string
          minLength: 1
          maxLength: 100
        templateKey:
          type: string
          enum: [generic, mcdonalds]
          description: Equipment template to seed. Defaults to "generic" when omitted.
      required: [name, adminEmail, adminName]

