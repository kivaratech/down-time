          description: Plaintext password. Shown exactly once.
      required: [id, email, name, password]

    CreateOrganizationResponse:
      type: object
      properties:
        organization:
          $ref: "#/components/schemas/Organization"
        admin:
          $ref: "#/components/schemas/OrgAdminWithPassword"
      required: [organization, admin]

    CreateOrgAdminRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          minLength: 1
          maxLength: 100
      required: [email, name]

    CreateOrgRestaurantRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        location:
