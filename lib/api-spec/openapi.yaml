openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: DownTime — Restaurant Equipment Issue Tracker API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: restaurants
    description: Restaurant operations
  - name: issues
    description: Issue tracking
  - name: comments
    description: Issue comments
  - name: equipment
    description: Equipment catalog
  - name: storage
    description: Object storage upload and serving endpoints
  - name: organization
    description: Per-organization settings for the caller's own org
  - name: super-admin
    description: Platform super-admin operations for provisioning customer organizations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/restaurant/login:
    post:
      operationId: restaurantLogin
      tags: [auth]
      summary: Restaurant PIN login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestaurantLoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestaurantLoginResponse"
        "401":
          description: Invalid PIN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/supervisor/login:
    post:
      operationId: supervisorLogin
      tags: [auth]
      summary: Supervisor login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupervisorLoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupervisorLoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/supervisor/logout:
    post:
      operationId: supervisorLogout
      tags: [auth]
      summary: Supervisor logout
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current session info
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /restaurants:
    get:
      operationId: listRestaurants
      tags: [restaurants]
      summary: List all restaurants (supervisor only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of restaurants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Restaurant"

  /restaurants/{id}:
    get:
      operationId: getRestaurant
      tags: [restaurants]
      summary: Get a restaurant by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Restaurant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Restaurant"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /restaurants/{id}/issues:
    get:
      operationId: listRestaurantIssues
      tags: [issues]
      summary: List open issues for a restaurant
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [open, waiting, resolved, all]
      responses:
        "200":
          description: List of issues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Issue"

  /issues:
    get:
      operationId: listIssues
      tags: [issues]
      summary: List all issues across all restaurants (supervisor)
      security:
        - bearerAuth: []
      parameters:
        - name: restaurantId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [open, waiting, resolved, all]
        - name: category
          in: query
          schema:
            type: string
            enum: [equipment, technology]
        - name: priority
          in: query
          schema:
            type: string
            enum: [urgent, normal, low]
        - name: assignedTo
          in: query
          schema:
            type: string
        - name: agingDays
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of issues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Issue"
    post:
      operationId: createIssue
      tags: [issues]
      summary: Create a new issue
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIssueRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /issues/{id}:
    get:
      operationId: getIssue
      tags: [issues]
      summary: Get an issue by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Issue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueWithComments"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateIssue
      tags: [issues]
      summary: Update an issue
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIssueRequest"
      responses:
        "200":
          description: Updated issue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Issue"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteIssue
      tags: [issues]
      summary: Delete a resolved issue (supervisor only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /issues/{id}/comments:
    post:
      operationId: addComment
      tags: [comments]
      summary: Add a comment to an issue
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
      responses:
        "201":
          description: Created comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /equipment:
    get:
      operationId: getEquipment
      tags: [equipment]
      summary: Get equipment list, optionally filtered by area
      security:
        - bearerAuth: []
      parameters:
        - name: area
          in: query
          schema:
            type: string
            enum: [Front Counter, Grill, Back of House, Technology]
      responses:
        "200":
          description: Equipment catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquipmentCatalog"

  /storage/uploads/request-url:
    post:
      tags: [storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /storage/objects/{objectPath}:
    get:
      tags: [storage]
      operationId: getStorageObject
      summary: Serve an uploaded object
      security:
        - bearerAuth: []
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object content
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /super-admin/equipment-templates:
    get:
      operationId: listEquipmentTemplates
      tags: [super-admin]
      summary: List built-in equipment templates available for new organizations
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EquipmentTemplateSummary"
        "403":
          description: Super admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /organization/settings:
    get:
      operationId: getOrganizationSettings
      tags: [organization]
      summary: Get the caller's organization settings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Organization settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationSettings"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateOrganizationSettings
      tags: [organization]
      summary: Update the caller's organization settings (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationSettingsRequest"
      responses:
        "200":
          description: Updated organization settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationSettings"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /super-admin/organizations:
    get:
      operationId: listOrganizations
      tags: [super-admin]
      summary: List all organizations with summary stats
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Organizations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrganizationSummary"
        "403":
          description: Super admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createOrganization
      tags: [super-admin]
      summary: Create a new organization with seeded equipment and a first admin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrganizationResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Username already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /super-admin/organizations/{id}:
    get:
      operationId: getOrganization
      tags: [super-admin]
      summary: Get an organization with its restaurants, admins, and supervisors
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Organization detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: renameOrganization
      tags: [super-admin]
      summary: Rename an organization
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameOrganizationRequest"
      responses:
        "200":
          description: Renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteOrganization
      tags: [super-admin]
      summary: Hard delete an organization and all of its data (cascaded in a transaction)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /super-admin/organizations/{id}/restaurants:
    post:
      operationId: createOrgRestaurant
      tags: [super-admin]
      summary: Add a restaurant to an organization
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrgRestaurantRequest"
      responses:
        "201":
          description: Restaurant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Restaurant"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /super-admin/organizations/{id}/restaurants/{restaurantId}:
    patch:
      operationId: updateOrgRestaurant
      tags: [super-admin]
      summary: Update a restaurant's name and/or location
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: restaurantId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrgRestaurantRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Restaurant"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Restaurant not found in this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteOrgRestaurant
      tags: [super-admin]
      summary: Hard delete a restaurant and all of its issues, comments, sessions, pairing codes, and photos (cascaded in a transaction)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: restaurantId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          description: Restaurant not found in this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /super-admin/organizations/{id}/admins:
    post:
      operationId: createOrgAdmin
      tags: [super-admin]
      summary: Add an admin to an existing organization
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrgAdminRequest"
      responses:
        "201":
          description: Admin created; plaintext password returned once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgAdminWithPassword"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Username already taken in this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /super-admin/organizations/{id}/users/{userId}/reset-password:
    post:
      operationId: resetOrgUserPassword
      tags: [super-admin]
      summary: Generate a fresh random password for an org user (admin or supervisor) and revoke their sessions
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Password reset; new plaintext password returned once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetPasswordResponse"
        "404":
          description: User not found in this organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required: [success]

    RestaurantLoginRequest:
      type: object
      properties:
        pin:
          type: string
      required: [pin]

    RestaurantLoginResponse:
      type: object
      properties:
        token:
          type: string
        restaurant:
          $ref: "#/components/schemas/Restaurant"
      required: [token, restaurant]

    SupervisorLoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    SupervisorLoginResponse:
      type: object
      properties:
        token:
          type: string
        supervisor:
          $ref: "#/components/schemas/Supervisor"
      required: [token, supervisor]

    Supervisor:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [supervisor, admin, super_admin]
        specialty:
          type: string
          enum: [equipment, technology, both]
          description: >-
            Issue category this user handles. Drives notification routing and
            the default category filter on their issue list. Admins always get
            all notifications regardless of this value.
        organizationId:
          type: integer
          nullable: true
          description: Null only for super_admin accounts.
      required: [id, email, name, role, specialty, organizationId]

    MeResponse:
      type: object
      properties:
        type:
          type: string
          enum: [restaurant, supervisor]
        restaurant:
          $ref: "#/components/schemas/Restaurant"
        supervisor:
          $ref: "#/components/schemas/Supervisor"
      required: [type]

    Restaurant:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        location:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, name, location, createdAt]

    Issue:
      type: object
      properties:
        id:
          type: integer
        restaurantId:
          type: integer
        restaurantName:
          type: string
        area:
          type: string
          enum: [Front Counter, Grill, Back of House, Technology]
        category:
          type: string
          enum: [equipment, technology]
        equipmentType:
          type: string
        subItem:
          type: string
          nullable: true
        customLabel:
          type: string
          nullable: true
        description:
          type: string
        status:
          type: string
          enum: [open, waiting, resolved]
        assignedTo:
          type: string
          nullable: true
        priority:
          type: string
          enum: [urgent, normal, low]
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        commentCount:
          type: integer
        imageUrl:
          type: string
          nullable: true
      required:
        [
          id,
          restaurantId,
          restaurantName,
          area,
          category,
          equipmentType,
          description,
          status,
          createdAt,
          updatedAt,
          commentCount,
        ]

    IssueWithComments:
      allOf:
        - $ref: "#/components/schemas/Issue"
        - type: object
          properties:
            comments:
              type: array
              items:
                $ref: "#/components/schemas/Comment"
          required: [comments]

    Comment:
      type: object
      properties:
        id:
          type: integer
        issueId:
          type: integer
        authorName:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, issueId, authorName, body, createdAt]

    CreateIssueRequest:
      type: object
      properties:
        restaurantId:
          type: integer
        area:
          type: string
          enum: [Front Counter, Grill, Back of House, Technology]
        equipmentType:
          type: string
        subItem:
          type: string
          nullable: true
        customLabel:
          type: string
          nullable: true
        description:
          type: string
        assignedTo:
          type: string
          nullable: true
        imageUrl:
          type: string
          nullable: true
      required: [restaurantId, area, equipmentType, description]

    UpdateIssueRequest:
      type: object
      properties:
        status:
          type: string
          enum: [open, waiting, resolved]
        assignedTo:
          type: string
          nullable: true
        priority:
          type: string
          enum: [urgent, normal, low]
          nullable: true
        description:
          type: string

    CreateCommentRequest:
      type: object
      properties:
        authorName:
          type: string
        body:
          type: string
      required: [authorName, body]

    EquipmentItem:
      type: object
      properties:
        name:
          type: string
        subItems:
          type: array
          items:
            type: string
          nullable: true
        supportsCustomLabel:
          type: boolean
      required: [name]

    EquipmentArea:
